[[plugins]]
package = "netlify-plugin-cache"
  [plugins.inputs]
  paths = [ ".cache" ]


[[headers]]
    for = "/*"
    [headers.values]
    Content-Security-Policy = "upgrade-insecure-requests;"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "autoplay=(), camera=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=()"


[build]
  command = "npm run build"
  publish = "dist"


[[redirects]]
  from = "/blog/ciclo-di-incontri-«parliamo-di-fotografia»-8-marzo-2025-ore-16-30"
  to = "/blog/ciclo-di-incontri-parliamo-di-fotografia-8-marzo-2025-ore-16-30"
  status = 301


[[redirects]]
  from = "/blog/ciclo-di-incontri-%C2%ABparliamo-di-fotografia%C2%BB-8-marzo-2025-ore-1630/"
  to = "/blog/ciclo-di-incontri-parliamo-di-fotografia-8-marzo-2025-ore-16-30"
